<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bot Pairing | X Lord Hosting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#090A0F] text-gray-100 min-h-screen flex flex-col justify-between font-sans">

    <header class="p-6 border-b border-gray-800 flex justify-between items-center max-w-4xl mx-auto w-full">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-robot text-indigo-500 text-2xl"></i>
            <span class="font-bold text-xl tracking-wider text-white">X LORD <span class="text-indigo-500">HOSTING</span></span>
        </div>
        <span class="text-xs bg-indigo-950 text-indigo-300 px-3 py-1 rounded-full border border-indigo-800">WhatsApp Gateway</span>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-[#0e1118] border border-gray-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center">
            <div class="w-16 h-16 bg-indigo-900/40 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl border border-indigo-700/50">
                <i class="fa-brands fa-whatsapp"></i>
            </div>
            
            <h1 class="text-2xl font-bold mb-2">WhatsApp Pairing Code</h1>
            <p class="text-gray-400 text-sm mb-6">Enter your WhatsApp phone number with country code (e.g., 94712345678) to get your 8-digit linking code.</p>

            <div id="form-container">
                <div class="mb-4 text-left">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Phone Number</label>
                    <input type="text" id="phone" placeholder="947xxxxxxxx" class="w-full bg-[#161b22] border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition">
                </div>
                <button onclick="requestPairingCode()" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20">
                    Generate Pairing Code
                </button>
            </div>

            <div id="result-container" class="hidden mt-6">
                <div class="p-4 bg-[#161b22] border border-gray-700 rounded-lg">
                    <p class="text-xs text-gray-400 mb-1">Your Pairing Code:</p>
                    <div id="code-display" class="text-2xl font-mono font-bold text-indigo-400 tracking-widest my-2">----</div>
                    <p id="status-text" class="text-xs text-amber-400 mt-2"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Waiting for WhatsApp link...</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-4 text-center text-xs text-gray-600 border-t border-gray-900">
        &copy; 2026 X Lord Hosting. All rights reserved.
    </footer>

    <script>
        async function requestPairingCode() {
            const phone = document.getElementById('phone').value.trim();
            const btn = document.getElementById('submit-btn');
            
            if (!phone) {
                alert('Please enter your phone number.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Generating...';

            try {
                const res = await fetch(`/pair?phone=${encodeURIComponent(phone)}`);
                const data = await res.json();

                if (data.success && data.pairingCode) {
                    document.getElementById('form-container').classList.add('hidden');
                    document.getElementById('result-container').classList.remove('hidden');
                    document.getElementById('code-display').innerText = data.pairingCode;

                    pollSessionStatus(data.sessionId);
                } else {
                    alert(data.error || 'Failed to generate code.');
                    btn.disabled = false;
                    btn.innerHTML = 'Generate Pairing Code';
                }
            } catch (err) {
                alert('Network error. Please try again.');
                btn.disabled = false;
                btn.innerHTML = 'Generate Pairing Code';
            }
        }

        function pollSessionStatus(sessionId) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`/check/${sessionId}`);
                    const data = await res.json();

                    if (data.status === 'connected') {
                        clearInterval(interval);
                        document.getElementById('status-text').innerHTML = '<i class="fa-solid fa-check-circle mr-1 text-emerald-400"></i> Connected Successfully!';
                        document.getElementById('status-text').className = 'text-xs text-emerald-400 mt-2';
                        
                        setTimeout(() => {
                            alert('WhatsApp Session connected successfully!');
                        }, 1000);
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 3000);
        }
    </script>
</body>
</html>
